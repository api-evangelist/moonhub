name: Moonhub
description: 'Moonhub is an AI recruiting platform that deploys proprietary AI agents to source,
  qualify, engage, and vet candidates across millions of profiles, helping companies hire faster
  and more cost-effectively. Its agent products (Qualify AI, Engage AI, and Monitor AI) automatically
  identify qualified candidates, run outreach to convert them into interview-ready applicants, and
  analyze candidate intent to manage recruiter handoffs. Moonhub is backed by Khosla Ventures, GV,
  Greycroft, Time Ventures, and AIX Ventures; the Moonhub team joined Salesforce in 2026. The company
  ships a recruiter web application (recruiter.moonhub.ai) and publishes no public developer API, SDK,
  or documentation surface as of this profiling.'
